<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Nubank</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .btn-nubank {
            display: inline-block;
            padding: 16px 32px;
            background-color: #820ad1;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Link usando a API de redirecionamento da própria Play Store -->
    <a href="https://play.google.com/store/apps/details?id=com.nu.production" class="btn-nubank">
        Abrir Aplicativo Nubank
    </a>

</body>
</html>
