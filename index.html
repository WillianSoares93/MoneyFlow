<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Nubank</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .btn-nubank {
            display: inline-block;
            padding: 16px 32px;
            background-color: #820ad1; /* Roxo do Nubank */
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        .btn-nubank:hover {
            background-color: #6d08b1;
        }

        .aviso {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
            max-width: 280px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Botão com a nova estrutura de Intent e Fallback limpo -->
    <a href="intent://#Intent;scheme=nubank;package=com.nu.production;S.browser_fallback_url=https%3A%2F%2Fnubank.com.br;end" class="btn-nubank">
        Abrir Aplicativo Nubank
    </a>

    <p class="aviso">
        Se o seu navegador continuar bloqueando e abrir a loja, o botão "Abrir" dentro da própria página da Play Store levará você direto ao aplicativo.
    </p>

</body>
</html>
